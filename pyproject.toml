# This repository ships no Python API. It is a Markdown Agent Skill plus agents, evals,
# and stdlib-only helper scripts that are invoked by path.
#
# `pyproject.toml` and `lucid_writer/__init__.py` exist so `acumen` accepts the
# repository as a benchmark target. Two separate requirements, both hard failures:
#
#   1. `acumen.env.prepare_target` refuses any checkout without a `pyproject.toml`
#      declaring `[project].name`, and requires that name to resolve via
#      `importlib.metadata` inside the venv it builds.
#   2. `acumen.check._PROBE_CODE` then *imports* the module named by `top_level.txt`, or
#      else the normalised distribution name, and requires it to expose `__version__`.
#
# So the repository gains one trivial importable module and nothing else. `__version__` in
# `lucid_writer/__init__.py` is the single source of the version; this file reads it
# rather than repeating it, and `scripts/validate_repo.py` asserts plugin.json,
# .claude-plugin/plugin.json and .codex-plugin/plugin.json all agree.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lucid-writer"
dynamic = ["version"]
description = "Evidence-bounded research writing for articles, scientific and technical reports, revision, and manuscript review."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["research", "academic-writing", "scientific-writing", "manuscripts", "reports"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/mdmanurung/lucid-writer"

[tool.hatch.version]
path = "lucid_writer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lucid_writer"]

[tool.hatch.build.targets.sdist]
include = [
  "/lucid_writer",
  "/skills",
  "/agents",
  "/network",
  "/scripts",
  "/docs",
  "/evals",
  "/bench",
  "/README.md",
  "/LICENSE",
  "/NOTICE.md",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/CONTRIBUTING.md",
]
