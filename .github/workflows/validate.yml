name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_repo.py
      - run: python skills/research-writer/scripts/lint.py --self-test
      - run: python skills/research-writer/scripts/validate_ledger.py skills/research-writer/assets/claim-evidence-ledger.csv
      - run: bash -n scripts/install.sh
