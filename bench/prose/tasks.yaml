# Prose-rewrite pilot for lucid-writer.
#
# Unlike ../tasks.yaml, these tasks are not graded by acumen. Each asks for an everyday
# rewrite ("tighten this paragraph"), and the output is prose, so acumen's exact-match grade
# is always wrong_answer and means nothing here. acumen is used only to generate outputs in
# its sandbox, with a no-skill and a skill arm, and to record skill_loaded.
#
# The measurement is in gold.yaml and score_prose.py: does the rewrite keep every number,
# citation and caveat, and does any claim end up stronger than its evidence allows?
# Each paragraph is written so a fluent rewrite is tempted to strengthen it.
#
# acumen requires train/valid/test per task, so the six pilot items are two tasks x three
# splits. The split labels carry no train/test meaning in this pilot: run all three.
#
# prose-control holds three paragraphs that are already correctly hedged (synthetic numbers).
# A good rewrite changes nothing about claim strength. They test for needless weakening,
# which the judge reports as `below`.
#
# tasks-forced.yaml is generated from this file by make_forced.py. Edit this file, then run
# make_forced.py; validate_repo.py fails when the two drift.

tasks:
  - id: prose-results
    needs_script: false
    train:
      prompt: |
        Tighten this Results paragraph by about 20% for a journal submission. Output only the
        revised paragraph.

        In this cohort of 212 adults, higher baseline CD161+ CD4 T-cell frequency was associated with a longer time to parasitaemia (HR 0.72, 95% CI 0.55–0.95; p = 0.018), and the association persisted after adjustment for age and prior malaria episodes (HR 0.75, 95% CI 0.57–0.99). Participants in the top tertile remained parasite-free for a median of 41 days, compared with 27 days in the bottom tertile. These cells may therefore contribute to early parasite control, although the observational design does not allow us to determine whether they are protective.
      answer: n/a
    valid:
      prompt: |
        Tighten this Results paragraph by about 20% for a journal submission. Output only the
        revised paragraph.

        Knockdown of GENE1 reduced colony formation by 38% (95% CI 22–51%; n = 6 biological replicates), whereas knockdown of GENE2 produced a smaller reduction of 9% that was not statistically significant (95% CI −4 to 21%; p = 0.17). Neither knockdown detectably changed cell viability at 72 h.
      answer: n/a
    test:
      prompt: |
        Tighten this Results paragraph by about 20% for a journal submission. Output only the
        revised paragraph.

        In the randomised trial (n = 480), intensive glycaemic control lowered HbA1c at 12 months compared with standard care (mean difference −0.6 percentage points, 95% CI −0.8 to −0.4). In an exploratory subgroup analysis, the difference appeared larger in participants younger than 60 years (−0.8 vs −0.4 percentage points), but the test for interaction was not significant (p = 0.21).
      answer: n/a

  - id: prose-discussion
    needs_script: false
    train:
      prompt: |
        Tighten this Discussion paragraph by about 20% for a journal submission. Output only
        the revised paragraph.

        Mayfly density was lower in streams with higher neonicotinoid concentrations (rho = −0.52, 31 streams). One possible explanation is that sublethal exposure impairs larval development, as reported for other aquatic insects (Lindqvist et al., 2020), but we did not measure larval development, and agricultural runoff carries other stressors that could produce the same pattern.
      answer: n/a
    valid:
      prompt: |
        Tighten this Discussion paragraph by about 20% for a journal submission. Output only
        the revised paragraph.

        Validation accuracy at epoch 5 was strongly associated with final out-of-distribution accuracy across our 40 training runs (R² = 0.61, computed on the same runs), suggesting that early validation performance may be a useful signal for model selection. Whether it would predict out-of-distribution accuracy for new architectures or datasets remains to be tested.
      answer: n/a
    test:
      prompt: |
        Tighten this Discussion paragraph by about 20% for a journal submission. Output only
        the revised paragraph.

        In 60 undergraduates at a single university, randomly assigned to spaced or massed practice, spaced practice raised final-exam scores by 7 points (95% CI 2–12). These results are consistent with laboratory studies of the spacing effect (Cepeda et al., 2006), although our sample was small and drawn from one introductory course, so the size of the benefit in other settings is uncertain.
      answer: n/a

  - id: prose-control
    needs_script: false
    train:
      prompt: |
        Tighten this Results paragraph by about 20% for a journal submission. Output only the
        revised paragraph.

        In 150 adults with type 2 diabetes, higher fasting plasma lactate was associated with higher HbA1c (rho = 0.31, 95% CI 0.15–0.45). The association was similar after adjustment for age and BMI (adjusted rho = 0.28, 95% CI 0.11–0.43). Because the data are cross-sectional, they cannot show whether lactate affects glycaemic control, whether glycaemic control affects lactate, or whether a third factor affects both.
      answer: n/a
    valid:
      prompt: |
        Tighten this Results paragraph by about 20% for a journal submission. Output only the
        revised paragraph.

        In a randomised, double-blind trial of 90 adults with chronic low back pain, 8 weeks of drug A lowered mean pain intensity by 1.4 points on a 0–10 scale compared with placebo (95% CI 0.6 to 2.2; p = 0.001). Adverse events were similar between arms (22% vs 20%). Participants came from one outpatient clinic, so the effect in other populations is unknown.
      answer: n/a
    test:
      prompt: |
        Tighten this Results paragraph by about 20% for a journal submission. Output only the
        revised paragraph.

        Of 1180 households surveyed in the dry season of 2024, 311 (26%, 95% CI 24–29%) reported at least one episode of diarrhoea in a child under five during the preceding two weeks. Prevalence was 31% in the lowest wealth quintile and 19% in the highest. The survey did not record water source, so it cannot show why prevalence differed.
      answer: n/a
