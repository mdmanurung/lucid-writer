        In this cohort of 212 adults, higher baseline CD161+ CD4 T-cell frequency was associated with a longer time to parasitaemia (HR 0.72, 95% CI 0.55–0.95; p = 0.018), and the association persisted after adjustment for age and prior malaria episodes (HR 0.75, 95% CI 0.57–0.99). Participants in the top tertile remained parasite-free for a median of 41 days, compared with 27 days in the bottom tertile. These cells may therefore contribute to early parasite control, although the observational design does not allow us to determine whether they are protective.
